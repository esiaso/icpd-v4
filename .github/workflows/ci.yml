name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: icpd, POSTGRES_PASSWORD: icpd, POSTGRES_DB: icpd_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U icpd" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://icpd:icpd@localhost:5432/icpd_test?schema=public
      DATABASE_URL: postgresql://icpd:icpd@localhost:5432/icpd_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icpd/shared build
      - run: pnpm --filter @icpd/api exec prisma generate
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (shared domain + API)
        run: pnpm --filter @icpd/shared test && pnpm --filter @icpd/api test -- --passWithNoTests
      - name: API e2e tests
        run: pnpm --filter @icpd/api test:e2e
      - name: Build web
        run: pnpm --filter @icpd/web build
